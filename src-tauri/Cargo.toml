[package]
name = "vision-desktop"
version = "0.1.0-alpha.1"
description = "Vision Desktop node manager"
edition = "2021"

[lib]
name = "vision_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
once_cell = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
sysinfo = "0.33"
time = { version = "0.3", features = ["formatting"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
opener = "0.7"
secrecy = "0.10.3"
argon2 = { version = "0.5.3", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
getrandom = "0.4.3"
zeroize = "1.8.2"
ed25519-dalek = { version = "=2.2.0", features = ["zeroize"] }
bincode = "=1.3.3"
blake3 = "=1.8.4"

[target.'cfg(windows)'.dependencies]
tauri-plugin-dialog = { version = "=2.7.2", default-features = false }
tauri-plugin-single-instance = "=2.4.3"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
