name: Frontend dependency audit

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-dependency-audit.yml"
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-dependency-audit.yml"
  schedule:
    - cron: "47 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: npm package-lock audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Record toolchain
        run: node --version && npm --version

      - name: Audit locked frontend dependencies
        run: npm audit --package-lock-only --ignore-scripts --audit-level=moderate
