# Test-only permissions for the standalone Layer B transport classifier.

[[permission]]
identifier = "allow-wallet-get-status"
commands.allow = ["wallet_get_status"]

[[permission]]
identifier = "allow-wallet-select-recovery-destination"
commands.allow = ["wallet_select_recovery_destination"]

[[permission]]
