name: Rust dependency audit

on:
  pull_request:
    paths:
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - ".github/workflows/rust-dependency-audit.yml"
  push:
    branches:
      - main
    paths:
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - ".github/workflows/rust-dependency-audit.yml"
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: RustSec Cargo.lock audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Record toolchain
        run: rustc --version && cargo --version

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked --no-default-features

      - name: Audit locked Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock --deny yanked
